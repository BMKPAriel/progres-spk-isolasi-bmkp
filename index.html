<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>Isolasi BMKP Harian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: header bar + side rail (desktop) / bottom tabs (phone); white work surfaces on a light steel ground, gold = action, charcoal = structure, red only for alerts */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F8F5; --line:#E3E4E8; --ink:#23262B; --ink-2:#5B6069; --ink-3:#8A8F98;
  --gold:#E0A100; --gold-soft:#FFF4D3; --gold-ink:#7A5600; --char:#2B2E33; --char-ink:#FFFFFF;
  --ok:#1E8E5A; --ok-soft:#E3F5EC; --warn:#B7791F; --warn-soft:#FDF1DC; --bad:#C0392B; --bad-soft:#FBE6E3; --info:#2F6FB0; --info-soft:#E6F0FA;
  --a1:#3C4A5A; --a2:#E0A100; --a3:#3F88C5; --a4:#2F8F86;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,24,30,.06),0 2px 8px rgba(20,24,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181C; --surface:#1F2227; --surface-2:#24282E; --line:#33373E; --ink:#ECEDEF; --ink-2:#B4B8BF; --ink-3:#868B93;
  --gold:#F2B51A; --gold-soft:#3A3018; --gold-ink:#F7CF6A; --char:#0F1114; --char-ink:#F3F3F3;
  --ok:#3CC487; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2D16; --bad:#F06B5D; --bad-soft:#3D1D1A; --info:#6AA6E6; --info-soft:#172A3D;
  --a1:#8FA3B8; --a2:#F2B51A; --a3:#6FB0E6; --a4:#4FC1B6; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181C; --surface:#1F2227; --surface-2:#24282E; --line:#33373E; --ink:#ECEDEF; --ink-2:#B4B8BF; --ink-3:#868B93;
  --gold:#F2B51A; --gold-soft:#3A3018; --gold-ink:#F7CF6A; --char:#0F1114; --char-ink:#F3F3F3;
  --ok:#3CC487; --ok-soft:#173326; --warn:#E5A84A; --warn-soft:#3A2D16; --bad:#F06B5D; --bad-soft:#3D1D1A; --info:#6AA6E6; --info-soft:#172A3D;
  --a1:#8FA3B8; --a2:#F2B51A; --a3:#6FB0E6; --a4:#4FC1B6; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--gold) 0 62%,var(--char) 62% 92%,var(--bad) 92%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1;display:block}
.brand small{color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chip.on .dot{background:var(--ok)} .chip.err .dot{background:var(--bad)}
.clock{font-family:var(--f-display);font-size:18px;font-weight:600}
/* shell */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100% - 64px)}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;height:calc(100vh - 64px)}
nav.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
nav.rail button svg{width:20px;height:20px;flex:none}
nav.rail button:hover{background:var(--surface-2);color:var(--ink)}
nav.rail button.act{background:var(--gold-soft);color:var(--gold-ink)}
nav.rail .foot{margin-top:auto;font-size:11px;color:var(--ink-3);padding:8px 12px}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;letter-spacing:.02em}
.sub{color:var(--ink-2);margin:4px 0 0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--char);color:var(--char-ink);border-radius:var(--r);overflow:hidden}
.stats>div{padding:14px 16px;border-right:1px solid rgba(255,255,255,.08)}
.stats>div:last-child{border-right:0}
.stats .lbl{color:rgba(255,255,255,.6)}
.stats .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05}
.stats .v small{font-size:16px;font-weight:600;opacity:.75;margin-left:3px}
.stats .s{font-size:12px;opacity:.7}
.stats .gold{color:var(--gold)}
/* area cards */
.area{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--ac,var(--gold))}
.area .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.area .nm{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1}
.area .md{font-size:12px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv>div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.kv span{font-size:11px;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.todo{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.todo div{display:flex;justify-content:space-between;gap:8px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.mini{width:90px}
/* forms */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.row{display:grid;gap:10px;align-items:end}
.ri{grid-template-columns:130px 150px 110px 1fr 140px 90px 36px}
.rr{grid-template-columns:130px 150px 110px 1fr 90px 36px}
.rk{grid-template-columns:1.2fr 80px 2fr 36px}
.rs{grid-template-columns:120px 150px 1fr 90px 36px}
.rows{display:flex;flex-direction:column;gap:8px}
.rowbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#231A00}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff;text-decoration:none}
.btn.ghost{background:none}
.btn.x{width:36px;height:38px;padding:0;color:var(--ink-3)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button.act{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:1px solid var(--line)}
.note{font-size:12px;color:var(--ink-3)}
.empty{padding:22px;text-align:center;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px}
.wa-prev{white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;background:#E7F7EC;color:#10261A;border-radius:12px;padding:14px 16px;border:1px solid #CBE9D5;min-height:260px;width:100%}
:root[data-theme="dark"] .wa-prev{background:#173326;color:#E6F5EC;border-color:#24543C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa-prev{background:#173326;color:#E6F5EC;border-color:#24543C}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--char);color:var(--char-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--ink-2);font-family:var(--f-body)}
.spkcard{display:flex;flex-direction:column;gap:10px}
.spkhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.spkmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12.5px}
.spkmeta div{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.spkmeta b{display:block;font-size:13.5px}
.lock{max-width:360px}
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:24px;border-top:4px solid var(--gold)}
.login .lg{display:flex;align-items:center;gap:12px}.login .lg img{width:56px;height:56px;border-radius:50%;background:#fff}
.login .err{color:var(--bad);font-weight:600;font-size:13px;margin:0}
.who{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-size:12px}.who b{font-size:13px}.who span{color:var(--ink-3)}
nav.tabs{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.rail{display:none}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink-3)}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.act{color:var(--gold-ink)}
  main{padding-bottom:90px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats>div:nth-child(2){border-right:0}
  .stats>div:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.08)}
  .ri,.rr,.rs{grid-template-columns:1fr 1fr}
  .ri .wide,.rr .wide,.rs .wide{grid-column:1/-1}
  .rk{grid-template-columns:1fr 80px}
  .rk .wide{grid-column:1/-1}
  .spkmeta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand small{display:none}
  .clock{display:none}
}
@media (max-width:560px){ .g4,.g3,.g2{grid-template-columns:1fr} .g4.hd{grid-template-columns:repeat(2,minmax(0,1fr))} h1{font-size:26px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><img id="logo" alt="Logo BMKP"><div><b>ISOLASI BMKP</b><small>Laporan harian · semua area</small></div></div>
  <div class="sp"></div>
  <span class="clock num" id="clock"></span>
  <button class="chip" id="userChip" type="button" title="Akun" hidden></button>
  <button class="chip" id="syncChip" type="button" title="Sinkronkan"><span class="dot"></span><span id="syncTxt">Lokal</span></button>
</header>
<div id="login" class="login" hidden></div>
<div class="shell" id="shell">
  <nav class="rail" id="rail"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden></div>

/* ---------- kalender kerja ---------- */
const isWork=s=>{const w=D(s).getUTCDay();return w>0&&w<6&&!DB.libur.includes(s)};
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0;for(let s=a;s<=b;s=addDays(s,1))if(isWork(s))n++;return n}
function nthWork(from,n){let s=from,c=0;for(let i=0;i<800;i++){if(isWork(s)){c++;if(c>=n)return s}s=addDays(s,1)}return s}
function nextWork(s){let x=addDays(s,1);while(!isWork(x))x=addDays(x,1);return x}

/* ---------- hitung SPK ---------- */
function spkCalc(s,ref){
  ref=ref||today();
  const keyOf=(j,u)=>j+'|'+u;
  const plan={};s.items.forEach(it=>{const k=keyOf(it.jenis,it.ukuran);plan[k]=(plan[k]||0)+Number(it.vol||0)});
  const got={};let first=null,last=null;
  liveLap().filter(l=>l.area===s.area&&l.tgl<=ref).forEach(l=>(l.items||[]).forEach(it=>{
    if(it.spk!==s.no||!(Number(it.vol)>0))return;const k=keyOf(it.jenis,it.ukuran);got[k]=(got[k]||0)+Number(it.vol);
    if(!first||l.tgl<first)first=l.tgl;if(!last||l.tgl>last)last=l.tgl}));
  let tp=0,td=0;Object.keys(plan).forEach(k=>{tp+=plan[k];td+=Math.min(plan[k],got[k]||0)});
  const prog=tp?td/tp:0;
  const hk=workdays(s.mulai,s.selesai)||1;const hkM=Math.max(1,Math.ceil(hk*DB.pct/100));
  const tMandor=nthWork(isWork(s.mulai)?s.mulai:nextWork(s.mulai),hkM);
  const done=prog>=0.999;
  let status,pred;
  if(done){status='Selesai';pred=last}
  else{
    let rate;
    if(first){rate=Math.max(prog/Math.max(1,workdays(first,ref)),0.02)}else{rate=1/hkM}
    const need=Math.max(1,Math.ceil((1-prog)/rate));
    const start=first?nextWork(ref):(ref<s.mulai?(isWork(s.mulai)?s.mulai:nextWork(s.mulai)):nextWork(ref));
    pred=nthWork(start,need);
    status=first?'Berjalan':(ref<s.mulai?'Belum mulai':'Terlambat mulai');
  }
  const ev=pred<=tMandor?'Sesuai target':pred<=s.selesai?'Lewat target mandor':'Lewat batas SPK';
  const tpd={};Object.keys(plan).forEach(k=>tpd[k]=plan[k]/hkM);
  const sisaHK=workdays(addDays(ref,1),s.selesai);
  return {plan,got,prog,tp,td,hk,hkM,tMandor,status,pred,ev,first,last,tpd,sisaHK};
}

function dayVol(area,tgl){const o={m:0,m2:0,lain:0};liveLap().filter(l=>l.area===area&&l.tgl===tgl).forEach(l=>(l.items||[]).forEach(it=>{

function hadirN(l){if(!l||!l.hadir)return 0;const h=l.hadir;return (+h.m||0)+(+h.f||0)+(+h.t||0)+(+h.h||0)}
function targetToday(area,tgl){let t=0;liveSpk().filter(s=>s.area===area).forEach(s=>{const c=spkCalc(s,tgl);

  const mx=Math.max(10,...data.map(r=>r.reduce((x,y)=>x+y,0)));const step=mx>60?20:mx>30?10:5;const top=Math.ceil(mx/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top);const bw=(W-pl-pr)/days.length;
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`}
  days.forEach((d,i)=>{let acc=0;const x=pl+i*bw+bw*.18,w=bw*.64;
    data[i].forEach((v,j)=>{if(v<=0)return;const y1=y(acc+v),y0=y(acc);g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" fill="${AC[areaIdx(AR[j].kode)%4]}" rx="2"><title>${AR[j].kode} ${tglID(d,true)}: ${fmt(v)} m</title></rect>`;acc+=v});

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Volume pipa harian per area">${g}</svg>`}

      <div class="spkmeta"><div><span class="note">Mulai SPK</span><b>${tglID(s.mulai,true)}</b></div><div><span class="note">Target mandor (${c.hkM} HK)</span><b style="color:var(--gold-ink)">${tglID(c.tMandor,true)}</b></div>
       <div><span class="note">Batas SPK (${c.hk} HK)</span><b>${tglID(s.selesai,true)}</b></div><div><span class="note">${c.status==='Selesai'?'Selesai tanggal':'Prediksi selesai'}</span><b>${tglID(c.pred,true)}</b></div></div>
      <div class="tw"><table><thead><tr><th>Jenis</th><th>Ukuran</th><th class="r">Volume SPK</th><th class="r">Terpasang</th><th class="r">Sisa</th><th class="r">Target / hari</th><th>Sat.</th></tr></thead><tbody>${byKey}</tbody></table></div>
      <div class="acts"><button class="btn sm" type="button" data-edit="${s.id}">Ubah SPK</button></div></div>`}).join('');

   <button class="btn pri" type="button" id="spkNew">+ SPK baru</button></div>
   <div class="seg" id="spkSeg">${(isPC()?['Semua',...DB.areas.map(a=>a.kode)]:[SES.area]).map(k=>`<button type="button" data-a="${esc(k)}" class="${k===SPK_AREA?'act':''}">${esc(k)}</button>`).join('')}</div>
   ${cards||'<div class="empty">Belum ada SPK untuk area ini. Tekan "+ SPK baru".</div>'}`;
  document.querySelectorAll('#spkSeg button').forEach(b=>b.onclick=()=>{SPK_AREA=b.dataset.a;R.spk()});
  $('#spkNew').onclick=()=>{SPK_EDIT={id:'spk-'+uid(),area:SPK_AREA==='Semua'?VA()[0].kode:SPK_AREA,no:'',uraian:'',mulai:today(),selesai:addDays(today(),7),items:[{jenis:'Pipa',ukuran:'4"',line:'',vol:''}],_new:true};R.spk()};
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{SPK_EDIT=JSON.parse(JSON.stringify(DB.spk.find(s=>s.id===b.dataset.edit)));R.spk()});

/* ---------- KIRIM WA ---------- */
const WA={area:'MA3',tgl:today()};
function itemLabel(x){return x.jenis==='Pipa'?`Pipa ${x.ukuran}`:x.jenis==='Lainnya'?(x.ukuran||'Lainnya'):`${x.jenis} ${x.ukuran}`}
function waText(area,tgl){
  const areas=area==='Semua'?DB.areas.map(a=>a.kode):[area];
  let out=`*LAPORAN HARIAN ISOLASI BMKP*\n${tglID(tgl)}\n`;
  areas.forEach(ak=>{
    const A=DB.areas[areaIdx(ak)],l=lapOf(ak,tgl);
    out+=`\n━━━━━━━━━━━━━━\n*AREA ${ak}*${A.mandor?` · Mandor ${A.mandor}`:''}\n`;
    if(!l){out+='_Belum ada laporan._\n';return}
    const h=l.hadir||{};out+=`Hadir: ${hadirN(l)}/${A.regu||7} orang (M ${h.m||0} · F ${h.f||0} · T ${h.t||0} · H ${h.h||0}) · Cuaca: ${l.cuaca||'-'}\n`;
    const its=(l.items||[]).filter(x=>Number(x.vol)>0);
    out+=`\n*Pekerjaan hari ini*\n`;
    if(!its.length)out+='- Tidak ada volume terpasang\n';
    const grp={};its.forEach(x=>{(grp[x.jenis]=grp[x.jenis]||[]).push(x)});
    Object.keys(grp).forEach(j=>{grp[j].forEach(x=>{out+=`- ${itemLabel(x)}: *${fmt(x.vol)} ${satOf(x.jenis)}*${x.keg?` (${x.keg.toLowerCase()})`:''}${x.spk?` · ${x.spk}`:''}${x.line?` · ${x.line}`:''}\n`})});
    const v=dayVol(ak,tgl);if(its.length)out+=`Total: pipa ${fmt(v.m)} m${v.m2?` · HE/dinding ${fmt(v.m2)} m²`:''}${v.lain?` · lainnya ${fmt(v.lain)}`:''}\n`;
    if((l.kendala||[]).length){out+=`\n*Kendala*\n`;l.kendala.forEach(k=>{out+=`- ${k.kat}${k.jam?` (${fmt(k.jam,1)} jam)`:''}${k.ket?`: ${k.ket}`:''}\n`})}
    const sp=liveSpk().filter(s=>s.area===ak).map(s=>({s,c:spkCalc(s,tgl)})).filter(x=>x.c.status!=='Selesai'||x.c.last===tgl);
    if(sp.length){out+=`\n*Progres SPK*\n`;sp.forEach(({s,c})=>{out+=`- ${s.no}: ${Math.round(c.prog*100)}% (${fmt(c.td,1)}/${fmt(c.tp,1)})${c.status==='Selesai'?' SELESAI':` · target ${tglID(c.tMandor,true)} · batas ${tglID(s.selesai,true)}`}${c.ev==='Lewat batas SPK'&&c.status!=='Selesai'?' ⚠':''}\n`})}
    if((l.rencana||[]).length){out+=`\n*Rencana besok (${tglID(nextWork(tgl),true)})*\n`;l.rencana.forEach(x=>{out+=`- ${itemLabel(x)}${x.target?`: target ${fmt(x.target)} ${satOf(x.jenis)}`:''}${x.spk?` · ${x.spk}`:''}${x.line?` · ${x.line}`:''}\n`})}
    if(l.catatan)out+=`\nCatatan: ${l.catatan}\n`;
    if(l.pelapor)out+=`\nPelapor: ${l.pelapor}\n`;
  });
  return out.trim();
}
R.wa=function(){
  const txt=waText(WA.area,WA.tgl);
  $('#view').innerHTML=`<div class="head"><div><h1>Kirim laporan ke grup WA</h1><p class="sub">Pesan disusun otomatis dari laporan harian. Bisa diedit sebelum dikirim.</p></div></div>
  <div class="card grid g3"><div class="f"><label for="wArea">Area</label><select id="wArea">${(isPC()?['Semua',...DB.areas.map(a=>a.kode)]:[SES.area]).map(k=>`<option ${k===WA.area?'selected':''} value="${esc(k)}">${k==='Semua'?'Semua area (1 pesan)':esc(k)}</option>`).join('')}</select></div>
   <div class="f"><label for="wTgl">Tanggal</label><input type="date" id="wTgl" value="${WA.tgl}"></div>
   <div class="f"><label>&nbsp;</label><div class="acts"><button class="btn dark" type="button" id="wCopy">Salin teks</button><a class="btn wa" id="wOpen" target="_blank" rel="noopener" href="#">Buka WhatsApp</a></div></div></div>
  <div class="card"><label class="lbl" for="wTxt">Pratinjau pesan</label><textarea id="wTxt" class="wa-prev" style="margin-top:8px" rows="22">${esc(txt)}</textarea>
   <p class="note" style="margin:8px 0 0">"Buka WhatsApp" membuka WA dengan pesan terisi; pilih grup proyek lalu kirim. Bila tidak terbuka, pakai "Salin teks" lalu tempel di grup.</p></div>`;
  const upd=()=>{$('#wOpen').href='https://wa.me/?text='+encodeURIComponent($('#wTxt').value)};upd();
  $('#wTxt').oninput=upd;
  $('#wArea').onchange=e=>{WA.area=e.target.value;R.wa()};$('#wTgl').onchange=e=>{WA.tgl=e.target.value||today();R.wa()};
  $('#wCopy').onclick=()=>{const t=$('#wTxt');navigator.clipboard?.writeText(t.value).then(()=>toast('Teks tersalin, tempel di grup WA')).catch(()=>{t.select();toast('Tekan Ctrl+C / salin manual')})};

/* ---------- REKAP ---------- */
let RK_MON=today().slice(0,7),RK_AREA='Semua';
R.rekap=function(){
  const [y,m]=RK_MON.split('-').map(Number);const areas=RK_AREA==='Semua'?VA().map(a=>a.kode):[RK_AREA];
  const laps=liveLap().filter(l=>l.tgl.slice(0,7)===RK_MON&&areas.includes(l.area));
  const agg={};laps.forEach(l=>(l.items||[]).forEach(x=>{const v=Number(x.vol)||0;if(!v)return;const k=x.jenis+'|'+x.ukuran;agg[k]=agg[k]||{};agg[k][l.area]=(agg[k][l.area]||0)+v}));
  const order=k=>{const [j,u]=k.split('|');return (Object.keys(JENIS).indexOf(j))*100+((JENIS[j].opts||[]).indexOf(u)+1)};
  const keys=Object.keys(agg).sort((a,b)=>order(a)-order(b));
  const rows=keys.map(k=>{const [j,u]=k.split('|');const tot=areas.reduce((x,a)=>x+(agg[k][a]||0),0);
    return `<tr><td>${esc(j)}</td><td><b>${esc(u)}</b></td>${areas.map(a=>`<td class="r num">${agg[k][a]?fmt(agg[k][a]):'-'}</td>`).join('')}<td class="r num"><b>${fmt(tot)}</b></td><td>${satOf(j)}</td></tr>`}).join('');
  const days=[...new Set(laps.map(l=>l.tgl))].sort().reverse();
  const hist=days.map(t=>areas.map(a=>{const l=lapOf(a,t);if(!l)return '';const v=dayVol(a,t);
    return `<tr><td class="num">${tglID(t,true)}</td><td><b>${esc(a)}</b></td><td class="r num">${fmt(v.m)}</td><td class="r num">${v.m2?fmt(v.m2):'-'}</td><td class="r num">${hadirN(l)}</td><td>${esc((l.kendala||[]).map(k=>k.kat).join(', ')||'-')}</td>
    <td><button class="btn sm" type="button" data-open="${esc(a)}|${t}">Buka</button></td></tr>`}).join('')).join('');
  const hk=workdays(`${RK_MON}-01`,iso(new Date(Date.UTC(y,m,0))));
  const totM=laps.reduce((x,l)=>x+dayVol(l.area,l.tgl).m,0);
  $('#view').innerHTML=`<div class="head"><div><h1>Rekap ${BULANP[m-1]} ${y}</h1><p class="sub">${hk} hari kerja · ${laps.length} laporan · pipa ${fmt(totM)} m</p></div>
   <div class="acts"><input type="month" id="rMon" value="${RK_MON}" style="width:auto"><button class="btn" type="button" id="rCsv">Unduh CSV</button></div></div>
  <div class="seg" id="rSeg">${(isPC()?['Semua',...DB.areas.map(a=>a.kode)]:[SES.area]).map(k=>`<button type="button" data-a="${esc(k)}" class="${k===RK_AREA?'act':''}">${esc(k)}</button>`).join('')}</div>
  <div class="card"><h2>Volume per jenis & ukuran</h2>${rows?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>Jenis</th><th>Ukuran</th>${areas.map(a=>`<th class="r">${esc(a)}</th>`).join('')}<th class="r">Total</th><th>Sat.</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty" style="margin-top:10px">Belum ada volume terpasang di bulan ini.</div>'}</div>
  <div class="card"><h2>Riwayat laporan harian</h2>${hist?`<div class="tw" style="margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Area</th><th class="r">Pipa (m)</th><th class="r">m²</th><th class="r">Hadir</th><th>Kendala</th><th></th></tr></thead><tbody>${hist}</tbody></table></div>`:'<div class="empty" style="margin-top:10px">Belum ada laporan.</div>'}</div>`;
  $('#rMon').onchange=e=>{RK_MON=e.target.value||today().slice(0,7);R.rekap()};
  document.querySelectorAll('#rSeg button').forEach(b=>b.onclick=()=>{RK_AREA=b.dataset.a;R.rekap()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const [a,t]=b.dataset.open.split('|');IN.area=a;IN.tgl=t;IN.d=null;go('input')});
  $('#rCsv').onclick=()=>{const L=[['Tanggal','Area','Jenis','Ukuran','Kegiatan','SPK','Line','Volume','Satuan','Hadir','Pelapor']];
    laps.sort((a,b)=>a.tgl<b.tgl?-1:1).forEach(l=>(l.items||[]).forEach(x=>L.push([l.tgl,l.area,x.jenis,x.ukuran,x.keg,x.spk,x.line,String(x.vol).replace('.',','),satOf(x.jenis),hadirN(l),l.pelapor])));
    const csv=L.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=`Rekap_Isolasi_${RK_MON}.csv`;a.click();toast('CSV dibuat')};
};

/* ---------- PENGATURAN (khusus Project Control) ---------- */
R.set=function(){
  if(!isPC()){go('home');return}
  $('#view').innerHTML=`<div class="head"><div><h1>Pengaturan</h1><p class="sub">Area & PIN admin, kalender kerja, server, cadangan data.</p></div></div>
  <div class="card"><h2>Area, mandor & PIN admin</h2><p class="note" style="margin:4px 0 0">PIN baru diisi hanya bila ingin mengganti; kosong = PIN lama tetap. PIN minimal 4 angka.</p>
   <div class="tw" style="margin-top:10px"><table><thead><tr><th>Kode</th><th>Nama proyek</th><th>Mandor</th><th>Regu</th><th>PIN admin baru</th><th></th></tr></thead><tbody>
   ${DB.areas.map((a,i)=>`<tr><td><input data-ar="${i}" data-f="kode" value="${esc(a.kode)}" style="width:90px"></td><td><input data-ar="${i}" data-f="nama" value="${esc(a.nama)}"></td><td><input data-ar="${i}" data-f="mandor" value="${esc(a.mandor)}"></td><td><input type="number" data-ar="${i}" data-f="regu" value="${esc(a.regu)}" style="width:70px"></td><td><input type="password" inputmode="numeric" autocomplete="new-password" data-pin="${i}" placeholder="tetap" style="width:120px"></td><td>${DB.areas.length>1?`<button class="btn x" type="button" data-arx="${i}" aria-label="Hapus area">✕</button>`:''}</td></tr>`).join('')}
   </tbody></table></div><div class="acts" style="margin-top:10px"><button class="btn sm" type="button" id="arAdd">+ Tambah area</button><button class="btn sm pri" type="button" id="arSave">Simpan area & PIN</button></div></div>
  <div class="card grid g2"><div class="f"><label for="npin">PIN Project Control baru</label><input id="npin" type="password" inputmode="numeric" autocomplete="new-password"></div><div class="acts" style="align-self:end"><button class="btn sm" type="button" id="pinSave">Ganti PIN saya</button></div></div>
  <div class="card grid g2"><div class="f"><label for="pct">Target mandor (% hari kerja SPK)</label><input id="pct" type="number" min="50" max="100" value="${DB.pct}"></div>
   <div class="f"><label for="lib">Tanggal merah / stop plant (pisahkan koma, format 2026-12-25)</label><input id="lib" value="${esc(DB.libur.join(', '))}"></div>
   <div class="acts"><button class="btn sm pri" type="button" id="calSave">Simpan kalender</button></div></div>
  <div class="card grid g2"><div class="f"><label for="url">Alamat server (Google Apps Script /exec)</label><input id="url" value="${esc(DB.set.url)}"></div>
   <div class="f"><label for="tok">Kode akses server</label><input id="tok" value="${esc(DB.set.token)}"></div>
   <div class="acts"><button class="btn sm pri" type="button" id="srvSave">Simpan & uji sambungan</button></div>
   <p class="note" id="srvMsg" style="margin:0;grid-column:1/-1">Status: ${esc($('#syncTxt').textContent)}</p></div>
  <div class="card"><h2>Cadangan data</h2><div class="acts" style="margin-top:10px"><button class="btn sm" type="button" id="bk">Unduh cadangan (.json)</button><label class="btn sm" for="rs">Pulihkan dari cadangan</label><input type="file" id="rs" accept=".json" hidden></div></div>`;
  document.querySelectorAll('[data-ar]').forEach(x=>x.oninput=()=>{DB.areas[+x.dataset.ar][x.dataset.f]=x.dataset.f==='regu'?Number(x.value):x.value});
  document.querySelectorAll('[data-arx]').forEach(b=>b.onclick=()=>{DB.areas.splice(+b.dataset.arx,1);R.set()});
  $('#arAdd').onclick=()=>{DB.areas.push({kode:'Area '+(DB.areas.length+1),nama:'',mandor:'',regu:7,pin:hpin(String(Date.now()).slice(-6))});R.set()};
  const cfgPush=()=>{DB.cfgUbah=Date.now();save();push([{tipe:'cfg',rec:cfgRec()}])};
  $('#arSave').onclick=()=>{let bad=false;document.querySelectorAll('[data-pin]').forEach(x=>{const v=x.value.trim();if(!v)return;if(v.length<4){bad=true;return}DB.areas[+x.dataset.pin].pin=hpin(v)});
    if(bad){toast('PIN minimal 4 angka');return}cfgPush();toast('Area & PIN tersimpan');nav();R.set()};
  $('#pinSave').onclick=()=>{const v=$('#npin').value.trim();if(v.length<4){toast('PIN minimal 4 angka');return}DB.set.pcPin=hpin(v);cfgPush();toast('PIN Project Control diganti');$('#npin').value=''};
  $('#calSave').onclick=()=>{DB.pct=Math.min(100,Math.max(50,Number($('#pct').value)||80));DB.libur=$('#lib').value.split(',').map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));cfgPush();toast('Kalender tersimpan');R.set()};
  $('#srvSave').onclick=async()=>{DB.set.url=$('#url').value.trim();DB.set.token=$('#tok').value.trim();save();$('#srvMsg').textContent='Menguji…';const r=await sync();$('#srvMsg').textContent=r===true?'Tersambung ke server.':'Gagal: '+r};
  $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download=`Cadangan_Isolasi_BMKP_${today()}.json`;a.click()};
  $('#rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.spk||!x.lap)throw 0;DB=x;load2();save();toast('Data dipulihkan');R.set()}catch(_){toast('Berkas cadangan tidak dikenali')}};r.readAsText(f)};
};
function load2(){const t=JSON.stringify(DB);try{localStorage.setItem(LS,t)}catch(e){}load()}

/* ---------- AKUN ---------- */
R.akun=function(){
  $('#view').innerHTML=`<div class="head"><div><h1>Akun</h1><p class="sub">Masuk sebagai <b>${esc(SES.nama)}</b> · ${isPC()?'Project Control (semua area)':'Admin '+esc(SES.area)}</p></div></div>
  <div class="card lock f"><p style="margin:0">Keluar dari perangkat ini? Data laporan tetap tersimpan.</p><div class="acts"><button class="btn dark" type="button" id="outYes">Keluar</button><button class="btn" type="button" id="outNo">Batal</button></div></div>`;
  $('#outYes').onclick=()=>{SES=null;try{localStorage.removeItem(LS_SES)}catch(e){}showLogin()};$('#outNo').onclick=()=>go('home')};
$('#userChip').onclick=()=>go('akun');

/* ---------- MASUK ---------- */
function showLogin(msg){
  $('#shell').hidden=true;$('#tabs').hidden=true;$('#userChip').hidden=true;const L=$('#login');L.hidden=false;
  const prev={r:($('#lgRole')||{}).value,n:($('#lgNama')||{}).value,p:($('#lgPin')||{}).value};
  L.innerHTML=`<form class="card" id="lgForm" autocomplete="off">
    <div class="lg"><img src="${LOGO}" alt="Logo BMKP"><div><h1 style="font-size:26px">Isolasi BMKP</h1><div class="note">Laporan harian · semua area</div></div></div>
    <div class="f"><label for="lgRole">Masuk sebagai</label><select id="lgRole">${DB.areas.map(a=>`<option value="${esc(a.kode)}">Admin ${esc(a.kode)}${a.mandor?' · '+esc(a.mandor):''}</option>`).join('')}<option value="__pc">Project Control</option></select></div>
    <div class="f"><label for="lgNama">Nama Anda</label><input id="lgNama" required placeholder="nama yang tampil di laporan"></div>
    <div class="f"><label for="lgPin">PIN</label><input id="lgPin" type="password" inputmode="numeric" required></div>
    <p class="err" id="lgErr">${msg?esc(msg):''}</p>
    <button class="btn pri" type="submit">Masuk</button>
    <p class="note" style="margin:0" id="lgSrv">${esc($('#syncTxt').textContent)}</p></form>`;
  if(prev.r)$('#lgRole').value=prev.r;if(prev.n)$('#lgNama').value=prev.n;if(prev.p)$('#lgPin').value=prev.p;
  $('#lgForm').onsubmit=e=>{e.preventDefault();const r=$('#lgRole').value,n=$('#lgNama').value.trim(),pin=$('#lgPin').value.trim();
    if(!n){$('#lgErr').textContent='Isi nama Anda.';return}
    const ok=r==='__pc'?hpin(pin)===DB.set.pcPin:(DB.areas.find(a=>a.kode===r)||{}).pin===hpin(pin);
    if(!ok){$('#lgErr').textContent='PIN salah untuk pilihan ini.';return}
    SES=r==='__pc'?{role:'pc',nama:n}:{role:'area',area:r,nama:n};try{localStorage.setItem(LS_SES,JSON.stringify(SES))}catch(_){}
    startApp()};
}
function startApp(){
  $('#login').hidden=true;$('#shell').hidden=false;$('#tabs').hidden=false;
  if(!isPC()){IN.area=SES.area;SPK_AREA=SES.area;WA.area=SES.area;RK_AREA=SES.area}
  IN.d=null;VIEW='home';nav();R.home()}

/* ---------- sinkron server ---------- */
const cfgRec=()=>({id:'cfg',areas:DB.areas,libur:DB.libur,pct:DB.pct,pcPin:DB.set.pcPin,_ubah:DB.cfgUbah||1});
function chip(state,txt){const c=$('#syncChip');c.className='chip '+(state||'');$('#syncTxt').textContent=txt}
async function push(list){if(!DB.set.url)return;try{chip('', 'Mengirim…');
  const rows=list.map(x=>({id:x.rec.id,tipe:x.tipe,_ubah:x.rec._ubah||Date.now(),json:JSON.stringify(x.rec)}));
  const r=await fetch(DB.set.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:DB.set.token,rows})});
  const j=await r.json();if(!j.ok)throw new Error(j.err||'gagal');chip('on','Tersinkron')}catch(e){chip('err','Gagal kirim')}}
async function sync(){if(!DB.set.url){chip('','Lokal');return 'alamat server kosong'}
  try{chip('','Sinkron…');const r=await fetch(DB.set.url+(DB.set.url.includes('?')?'&':'?')+'token='+encodeURIComponent(DB.set.token));const j=await r.json();if(!j.ok)throw new Error(j.err||'ditolak server');
    const remote={};j.rows.forEach(x=>{try{remote[x.id]={tipe:x.tipe,rec:JSON.parse(x.json)}}catch(_){}});
    const out=[];
    ['spk','lap'].forEach(t=>{const loc={};DB[t].forEach(x=>loc[x.id]=x);
      Object.values(remote).filter(x=>x.tipe===t).forEach(({rec})=>{const l=loc[rec.id];if(!l||(rec._ubah||0)>(l._ubah||0))loc[rec.id]=rec});
      DB[t].forEach(x=>{const rm=remote[x.id];if(!rm||(x._ubah||0)>(rm.rec._ubah||0))out.push({tipe:t,rec:x})});DB[t]=Object.values(loc)});
    const rc=remote.cfg;if(rc&&(rc.rec._ubah||0)>(DB.cfgUbah||0)){DB.areas=rc.rec.areas;DB.libur=rc.rec.libur||[];DB.pct=rc.rec.pct||80;if(rc.rec.pcPin)DB.set.pcPin=rc.rec.pcPin;DB.cfgUbah=rc.rec._ubah}
    else if(!rc||(DB.cfgUbah||0)>(rc.rec._ubah||0))out.push({tipe:'cfg',rec:cfgRec()});
    save();if(out.length)await push(out);chip('on','Tersinkron');if(SES){nav();if(VIEW!=='input'&&VIEW!=='spk')R[VIEW]()}else showLogin();return true}catch(e){chip('err','Server tidak terjangkau');if(!SES)showLogin();return (e&&e.message)||'server tidak terjangkau'}}
$('#syncChip').onclick=sync;

if(SES)startApp();else showLogin();sync();setInterval(()=>{if(SES&&document.visibilityState==='visible')sync()},120000);
</script>
